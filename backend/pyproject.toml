[project]
name = "spellbook-backend"
version = "0.1.0"
description = "FastAPI + WebSocket backend that streams netanal pcap analysis and live captures to the Spellbook frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "netanal",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "mypy>=1.19.1",
    "ruff>=0.14.14",
]

[project.scripts]
spellbook-server = "spellbook.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spellbook"]

[tool.uv.sources]
netanal = { path = "../../network-traffic-analyzer", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src/spellbook"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
